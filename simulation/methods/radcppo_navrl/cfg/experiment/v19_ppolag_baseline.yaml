# @package _global_

# Strong training-side comparator: conventional scalar expected-cost
# PPO-Lagrangian fine-tuning.  It uses no PC-ARP losses, no decoupled safety
# encoder, no distributional/CVaR objective, and no gated residual actor.
algo:
  method:
    isolate_auxiliary_gradients: false
    freeze_pretrained_task_policy: false
    use_decoupled_safety_encoder: false
    safety_warmup_updates: 0
    num_quantiles: 1
    safety_critic_coefficient: 1.0
    counterfactual_coefficient: 0.0
    adaptive_safety_lambda: true
    dual_learning_rate: 5.0e-3
    initial_safety_lambda: 0.0
    distillation_coefficient: 0.0
    safe_anchor_coefficient: 0.0
    adapter_shift_coefficient: 0.0
    safe_gate_coefficient: 0.0
    risk_measure: "mean"
    cvar_alpha: 0.9
    safety_budget: 0.05
    actor_adapter:
      enabled: false
      gate_mode: "learned"
      parameterization: "mean"
      maximum_logit_bias: 0.0
      maximum_mean_shift: 0.0
      gate_temperature: 1.75
      initial_gate_bias: 0.0
      learning_rate: 5.0e-4
      gate_coefficient: 0.0
    risk_selector:
      enabled: false
      action_step_mps: 0.08
      activation_threshold: 0.20
      minimum_risk_reduction: 0.015
      deviation_penalty: 0.002
      projection_blend: 1.0
      projection_smoothing: 0.8
      require_tail_dominance: false
